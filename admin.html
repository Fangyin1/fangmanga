<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — FangManga</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><a class="brand" href="index.html">FANG<span>ADMIN</span></a><div class="actions"><button id="logout">LOGOUT</button></div></header><main class="admin"><section id="loginBox" class="panel"><p class="eyebrow">PRIVATE AREA</p><h1>ADMIN LOGIN</h1><p>Gunakan email dan password admin Supabase yang sudah kamu buat.</p><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button id="login" class="primary">MASUK</button><div id="loginMsg" class="msg"></div></section><section id="dashboard" hidden><div class="section-head"><span>ADMIN DASHBOARD</span><span id="who"></span></div><div id="adminStats" class="admin-stats"><div class="stat-card"><small>MANGA</small><strong>—</strong></div></div><div class="panel"><h2>Manga Paling Banyak Dibaca</h2><div id="popularAdmin" class="popular-admin">Memuat statistik...</div></div><div class="admin-grid"><form id="mangaForm" class="panel"><h2>Tambah Manga</h2><input id="title" placeholder="Judul manga" required><input id="slug" placeholder="slug, contoh: lookism" required><textarea id="description" placeholder="Sinopsis"></textarea><input id="genres" placeholder="Genre, pisahkan koma"><select id="status"><option>ongoing</option><option>completed</option><option>hiatus</option></select><label>Cover <input id="cover" type="file" accept="image/*"></label><button class="primary">Simpan Manga</button><div id="mangaMsg" class="msg"></div></form><form id="chapterForm" class="panel"><h2>Tambah Chapter</h2><select id="mangaSelect" required></select><input id="chapterNumber" type="number" step="0.1" placeholder="Nomor chapter" required><input id="chapterTitle" placeholder="Judul chapter (opsional)"><label>Halaman manga <input id="pages" type="file" accept="image/*" multiple required></label><button class="primary">Upload Chapter</button><div id="chapterMsg" class="msg"></div></form></div><div class="panel"><h2>Daftar Manga</h2><div id="adminList"></div></div></section></main><script src="admin.js"></script></body></html>
